name: Release

# Triggered when a semver tag (vX.Y.Z) is pushed. Builds and publishes a
# semver-tagged operator image to GHCR with the same supply-chain guarantees
# as the main-branch publish flow: cosign keyless signature + SBOM
# attestation + SLSA provenance attestation + Trivy scan.
#
# This workflow is intentionally a near-copy of the `publish` job in
# operator-image.yaml rather than a reusable workflow — keeping it standalone
# avoids cross-workflow permission-inheritance footguns and keeps the supply
# chain auditable in a single file.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vllm-operator

jobs:
  release-image:
    name: Build, sign, and publish release image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # for keyless cosign signing via GitHub OIDC
      attestations: write   # SBOM + provenance attestations published via build-push-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On a `vX.Y.Z` tag push, emit:
          #   - vX.Y.Z (full semver)
          #   - X.Y.Z  (semver without the `v` prefix)
          #   - X.Y    (major.minor — moves forward across patch releases)
          #   - X      (major — moves forward across minor releases)
          # `latest` is intentionally NOT applied here either; consumers
          # pin to a semver tag or an immutable digest.
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: operator
          file: operator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # See operator-image.yaml's matching step for the rationale on
          # signing each tag at the immutable digest.
          echo "${TAGS}" | xargs -I{} cosign sign --yes "{}@${DIGEST}"

      - name: Trivy vulnerability scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
