name: PR validation

on:
  pull_request:

# Default to read-only token for all jobs; no job in this workflow needs
# elevated permissions (purely a validation/linting workflow).
permissions:
  contents: read

jobs:
  # ── Determine which areas changed ─────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      operator: ${{ steps.filter.outputs.operator }}
      manifests: ${{ steps.filter.outputs.manifests }}
      patches: ${{ steps.filter.outputs.patches }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            operator:
              - "operator/**"
            manifests:
              - "operator/config/**"
              - "operator/api/**"
              - ".github/workflows/pr-validate.yaml"
            patches:
              - "patches/**"
              - "Dockerfile"

  # ── Go: generated files are up-to-date ────────────────────────────────────
  # NOTE: this job ALWAYS runs so the "Generated code is up-to-date" required
  # status context always reports. When `changes.outputs.operator != 'true'`
  # the work is skipped at the step level and the job reports success.
  # Don't add a job-level `if:` here — `main` branch protection treats a
  # SKIPPED required job as not-satisfied.
  generated:
    name: Generated code is up-to-date
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      # Always check out so the `operator/` working-directory exists, even
      # when we're about to short-circuit. The no-op echo runs after this.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: No-op when operator unchanged
        if: needs.changes.outputs.operator != 'true'
        run: echo "No operator changes; skipping generated-code check."

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: needs.changes.outputs.operator == 'true'
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install controller-gen
        if: needs.changes.outputs.operator == 'true'
        run: GOBIN=/usr/local/bin go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1

      - name: Check go mod tidy
        if: needs.changes.outputs.operator == 'true'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy — run 'go mod tidy' and commit the result"; exit 1; }

      - name: Check deepcopy is current
        if: needs.changes.outputs.operator == 'true'
        run: |
          make generate
          git diff --exit-code \
            || { echo "::error::Generated deepcopy is stale — run 'make generate' and commit the result"; exit 1; }

      - name: Check CRD/RBAC manifests are current
        if: needs.changes.outputs.operator == 'true'
        run: |
          make manifests
          git diff --exit-code \
            || { echo "::error::Generated CRD/RBAC manifests are stale — run 'make manifests' and commit the result"; exit 1; }

  # ── YAML: Kubernetes manifests are valid ──────────────────────────────────
  # Same always-run pattern as `generated` above — see the comment there.
  yaml-validate:
    name: Kubernetes manifests are valid
    needs: changes
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.4
    steps:
      # Checkout has no defaults.working-directory issue here, but kept
      # unconditional for symmetry with `generated` above.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: No-op when manifests unchanged
        if: needs.changes.outputs.manifests != 'true'
        run: echo "No manifest changes; skipping kubeconform validation."

      - name: Install kubeconform
        if: needs.changes.outputs.manifests == 'true'
        run: |
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate sample manifests
        if: needs.changes.outputs.manifests == 'true'
        run: |
          kubeconform \
            -kubernetes-version 1.29.0 \
            -strict \
            -summary \
            -ignore-missing-schemas \
            operator/config/samples/presets/*.yaml \
            operator/config/samples/instances/*.yaml \
            operator/config/storage/*.yaml \
            operator/config/mig-setup/serviceaccount.yaml \
            operator/config/mig-setup/clusterrole.yaml \
            operator/config/mig-setup/clusterrolebinding.yaml \
            operator/config/mig-setup/configmap.yaml \
            operator/config/manager/manager.yaml \
            operator/config/rbac/role.yaml

      - name: Validate CRD bases (if generated)
        if: needs.changes.outputs.manifests == 'true'
        # CRDs are themselves CustomResourceDefinition resources whose meta-schema
        # isn't always in kubeconform's default catalog at every k8s version, so
        # `-ignore-missing-schemas` is required (matches the sample-manifests step
        # above). YAML structure / unknown-field strictness still apply for
        # resources whose schemas DO load.
        run: |
          if ls operator/config/crd/bases/*.yaml 2>/dev/null | grep -q .; then
            kubeconform \
              -kubernetes-version 1.29.0 \
              -strict \
              -summary \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              operator/config/crd/bases/*.yaml
          else
            echo "No generated CRDs yet (run make manifests); skipping."
          fi

  # ── Python: build-time patch injection tests ──────────────────────────────
  # Same always-run pattern as `generated` / `yaml-validate` above — the job
  # has no job-level `if:` so the required status context always reports; work
  # is skipped at the step level when `patches` is unchanged. Guards apply_patch.py
  # against silent anchor drift in vLLM's Anthropic protocol (issue #137).
  patches-test:
    name: Patch injection tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: No-op when patches unchanged
        if: needs.changes.outputs.patches != 'true'
        run: echo "No patch changes; skipping patch tests."

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: needs.changes.outputs.patches == 'true'
        with:
          python-version: '3.12'

      - name: Install pytest
        if: needs.changes.outputs.patches == 'true'
        run: pip install pytest

      - name: Run patch tests
        if: needs.changes.outputs.patches == 'true'
        # Run from the repo root so both import styles resolve:
        #   test_apply_patch.py  -> `import patches.apply_patch`
        #   test_system_hoist.py -> `from system_hoist import ...` (pytest adds patches/ to sys.path)
        run: python -m pytest patches/ -q
