name: Operator image

on:
  push:
    branches:
      - main
    paths:
      - "operator/**"
      - ".github/workflows/operator-image.yaml"
  # No `paths:` filter on pull_request — the `Build & test` job is a required
  # status check on `main`, and a path-filtered workflow that doesn't trigger
  # leaves the context unreported, which branch protection treats as
  # not-satisfied. The job itself short-circuits below when no operator
  # files changed, so docs-only PRs still get a fast SUCCESS.
  pull_request:

# Default to read-only token for all jobs; jobs that need write access
# (e.g. `publish` pushing to GHCR) opt-in via job-level `permissions:`.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vllm-operator

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            operator:
              - "operator/**"
              - ".github/workflows/operator-image.yaml"

      - name: No-op when operator unchanged
        if: steps.filter.outputs.operator != 'true'
        run: echo "No operator changes; skipping build/test."

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.filter.outputs.operator == 'true'
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install controller-gen
        if: steps.filter.outputs.operator == 'true'
        run: GOBIN=/usr/local/bin go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1

      - name: govulncheck
        if: steps.filter.outputs.operator == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Lint
        if: steps.filter.outputs.operator == 'true'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          working-directory: operator

      - if: steps.filter.outputs.operator == 'true'
        run: make generate fmt vet test

  publish:
    name: Publish image
    needs: ci
    # Only publish on pushes to main (not on PRs — forks lack GHCR write access)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # `contents: read` is sufficient for the build/sign/push steps; the
      # commit-back step (see end of job) authenticates with a dedicated
      # PAT (`COMMIT_BACK_PAT`) rather than `GITHUB_TOKEN`, so the
      # job-level token stays read-only. Using a PAT also avoids the
      # `GITHUB_TOKEN`-pushed-commits-don't-trigger-workflows rule, which
      # we rely on here because the digest-bump commit carries `[skip ci]`
      # but we still want branch protections to recognize a regular author.
      # See issue #110.
      contents: read
      packages: write
      id-token: write       # for keyless cosign signing via GitHub OIDC
      attestations: write   # SBOM + provenance attestations published via build-push-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is intentionally NOT applied — it is a mutable tag and
          # downstream consumers should pin to either the short-SHA tag or
          # the immutable image digest. Semver tags (v*) come from the
          # separate release.yaml workflow via `type=ref,event=tag`.
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: operator
          file: operator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # `cosign sign` with --yes accepts the Sigstore TUF terms non-interactively.
          # OIDC identity comes from the workflow's `id-token: write` permission.
          # We sign each tag-qualified reference at the immutable digest so the
          # signature is bound to the bytes we just pushed, not a mutable tag.
          echo "${TAGS}" | xargs -I{} cosign sign --yes "{}@${DIGEST}"

      - name: Trivy vulnerability scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Scan the freshly-pushed image at its immutable digest.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

      # ── Commit-back: re-pin operator/config/manager/manager.yaml ───────────
      # Mirrors the pattern used in firefox-mcp/.forgejo/workflows/build.yml
      # and toil-tracker's release workflow. After a successful build + sign
      # + scan, rewrite the `image:` line in manager.yaml to the freshly-built
      # digest and push the bump back to main so `make deploy` (and the
      # forthcoming ArgoCD source-of-truth, see issue #101) always resolves
      # to a known, signed, scanned image. Replaces the manual
      # `chore(operator): re-pin manager.yaml to <sha>` commits flagged in
      # forgejo-experiments#110.
      #
      # Requires a repo secret `COMMIT_BACK_PAT` (Personal Access Token with
      # `contents: write` scope on this repo). If the secret is missing the
      # step is skipped — the workflow still publishes the image, the operator
      # just keeps re-pinning manager.yaml by hand as before. Graceful
      # degradation matches firefox-mcp.
      #
      # The `[skip ci]` token in the commit message stops the auto-bump
      # from re-triggering this workflow on its own commit.
      - name: Re-pin manager.yaml image digest and push
        if: ${{ secrets.COMMIT_BACK_PAT != '' }}
        env:
          COMMIT_BACK_PAT: ${{ secrets.COMMIT_BACK_PAT }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO_FULL: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          NEW_IMAGE="${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
          # Anchor on the exact `image: ghcr.io/...vllm-operator@sha256:<hex>`
          # form already in manager.yaml so we never accidentally rewrite a
          # different image line (e.g. a sidecar) added later.
          sed -i -E \
            "s|image: ghcr.io/[^[:space:]]+/vllm-operator@sha256:[a-f0-9]{64}|image: ${NEW_IMAGE}|" \
            operator/config/manager/manager.yaml

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add operator/config/manager/manager.yaml
          if git diff --staged --quiet; then
            echo "manager.yaml already pinned to ${DIGEST} — nothing to commit."
            exit 0
          fi

          SHORT_DIGEST="${DIGEST#sha256:}"
          SHORT_DIGEST="${SHORT_DIGEST:0:12}"
          git commit -m "chore(operator): re-pin manager.yaml to ${SHORT_DIGEST} [skip ci]" \
                     -m "Auto-generated by .github/workflows/operator-image.yaml run ${GITHUB_RUN_ID}. Closes forgejo-experiments#110 once verified."

          git push "https://x-access-token:${COMMIT_BACK_PAT}@github.com/${REPO_FULL}.git" "HEAD:${BRANCH}"
