name: Operator image

on:
  push:
    branches:
      - main
    paths:
      - "operator/**"
      - ".github/workflows/operator-image.yaml"
  # No `paths:` filter on pull_request — the `Build & test` job is a required
  # status check on `main`, and a path-filtered workflow that doesn't trigger
  # leaves the context unreported, which branch protection treats as
  # not-satisfied. The job itself short-circuits below when no operator
  # files changed, so docs-only PRs still get a fast SUCCESS.
  pull_request:

# Default to read-only token for all jobs; jobs that need write access
# (e.g. `publish` pushing to GHCR) opt-in via job-level `permissions:`.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vllm-operator

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            operator:
              - "operator/**"
              - ".github/workflows/operator-image.yaml"

      - name: No-op when operator unchanged
        if: steps.filter.outputs.operator != 'true'
        run: echo "No operator changes; skipping build/test."

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        if: steps.filter.outputs.operator == 'true'
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Install controller-gen
        if: steps.filter.outputs.operator == 'true'
        run: GOBIN=/usr/local/bin go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.20.1

      - name: govulncheck
        if: steps.filter.outputs.operator == 'true'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

      - name: Lint
        if: steps.filter.outputs.operator == 'true'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.12.2
          working-directory: operator

      - if: steps.filter.outputs.operator == 'true'
        run: make generate fmt vet test

  publish:
    name: Publish image
    needs: ci
    # Only publish on pushes to main (not on PRs — forks lack GHCR write access)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # for keyless cosign signing via GitHub OIDC
      attestations: write   # SBOM + provenance attestations published via build-push-action
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is intentionally NOT applied — it is a mutable tag and
          # downstream consumers should pin to either the short-SHA tag or
          # the immutable image digest. Semver tags (v*) come from the
          # separate release.yaml workflow via `type=ref,event=tag`.
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: operator
          file: operator/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless via GitHub OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # `cosign sign` with --yes accepts the Sigstore TUF terms non-interactively.
          # OIDC identity comes from the workflow's `id-token: write` permission.
          # We sign each tag-qualified reference at the immutable digest so the
          # signature is bound to the bytes we just pushed, not a mutable tag.
          echo "${TAGS}" | xargs -I{} cosign sign --yes "{}@${DIGEST}"

      - name: Trivy vulnerability scan (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # Scan the freshly-pushed image at its immutable digest.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
