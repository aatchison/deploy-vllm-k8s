# Hand-authored binding for the generated namespace-scoped lease Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vllm-operator-leader-election
  namespace: vllm-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vllm-operator-role
subjects:
  - kind: ServiceAccount
    name: vllm-operator
    namespace: vllm-system
