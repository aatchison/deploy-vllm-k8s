apiVersion: vllm.aatchison.io/v1alpha1
kind: ModelPreset
metadata:
  name: gemma-4-31b-bf16-tp2
  namespace: vllm
spec:
  modelID: google/gemma-4-31B-it
  migResource: nvidia.com/mig-4g.96gb
  migResourceCount: 2
  dtype: bfloat16
  maxModelLen: 262144
  gpuMemoryUtilization: "0.95"
  tensorParallelSize: 2
  enableAutoToolChoice: true
  toolCallParser: gemma4
  shmSizeLimit: 32Gi
  progressDeadlineSeconds: 2400
  livenessProbe: {initialDelaySeconds: 1800, periodSeconds: 30, failureThreshold: 10}
  readinessProbe: {initialDelaySeconds: 300, periodSeconds: 15, failureThreshold: 60}
