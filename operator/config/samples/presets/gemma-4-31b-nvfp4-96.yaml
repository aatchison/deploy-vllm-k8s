apiVersion: vllm.aatchison.io/v1alpha1
kind: ModelPreset
metadata:
  name: gemma-4-31b-nvfp4-96
  namespace: vllm
spec:
  modelID: nvidia/Gemma-4-31B-IT-NVFP4
  migResource: nvidia.com/mig-4g.96gb
  migResourceCount: 1
  quantization: nvfp4
  maxModelLen: 131072
  gpuMemoryUtilization: "0.95"
  tensorParallelSize: 1
  enableAutoToolChoice: true
  toolCallParser: gemma4
  shmSizeLimit: 16Gi
  progressDeadlineSeconds: 1800
  livenessProbe: {initialDelaySeconds: 1200, periodSeconds: 30, failureThreshold: 10}
  readinessProbe: {initialDelaySeconds: 180, periodSeconds: 15, failureThreshold: 40}
