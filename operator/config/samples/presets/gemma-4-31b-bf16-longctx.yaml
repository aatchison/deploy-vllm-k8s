apiVersion: vllm.aatchison.io/v1alpha1
kind: LongContextPreset
metadata:
  name: gemma-4-31b-bf16-longctx
  namespace: vllm
spec:
  modelID: google/gemma-4-31B-it
  migResource: nvidia.com/mig-4g.96gb
  migResourceCount: 1
  dtype: bfloat16
  maxModelLen: 131072
  gpuMemoryUtilization: "0.92"
  tensorParallelSize: 1
  enableAutoToolChoice: true
  toolCallParser: gemma4
  shmSizeLimit: 16Gi
  progressDeadlineSeconds: 1800
  livenessProbe: {initialDelaySeconds: 1200, periodSeconds: 30, failureThreshold: 10}
  readinessProbe: {initialDelaySeconds: 240, periodSeconds: 15, failureThreshold: 60}
  kvCacheDtype: fp8_e5m2
  enablePrefixCaching: true
