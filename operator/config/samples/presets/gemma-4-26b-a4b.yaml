apiVersion: vllm.aatchison.io/v1alpha1
kind: ModelPreset
metadata:
  name: gemma-4-26b-a4b
  namespace: vllm
spec:
  modelID: google/gemma-4-26B-A4B-it
  # Per-variant served-model-name: keeps the `model_name` metric label
  # distinct from sibling presets so dashboards (and capacity planning)
  # can attribute traffic and latency to the specific tuning knob set.
  servedModelName: Gemma-4-26B-A4B
  migResource: nvidia.com/mig-4g.96gb
  migResourceCount: 1
  dtype: bfloat16
  maxModelLen: 131072
  gpuMemoryUtilization: "0.95"
  tensorParallelSize: 1
  enableAutoToolChoice: true
  toolCallParser: gemma4
  shmSizeLimit: 16Gi
  progressDeadlineSeconds: 1800
  livenessProbe: {initialDelaySeconds: 1200, periodSeconds: 30, failureThreshold: 10}
  readinessProbe: {initialDelaySeconds: 180, periodSeconds: 15, failureThreshold: 40}
