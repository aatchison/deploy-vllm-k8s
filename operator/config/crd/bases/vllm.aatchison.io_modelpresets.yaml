---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: modelpresets.vllm.aatchison.io
spec:
  group: vllm.aatchison.io
  names:
    kind: ModelPreset
    listKind: ModelPresetList
    plural: modelpresets
    shortNames:
    - mp
    singular: modelpreset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelID
      name: Model
      type: string
    - jsonPath: .spec.migResource
      name: MIG
      type: string
    - jsonPath: .spec.tensorParallelSize
      name: TP
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelPreset is a reusable bundle of vLLM configuration consumed
          by VLLMInstance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelPresetSpec holds a reusable bundle of vLLM args.
              ModelPreset has no controller — it's consumed by VLLMInstance at reconcile time.
            properties:
              dtype:
                type: string
              enableAutoToolChoice:
                type: boolean
              gpuMemoryUtilization:
                pattern: ^0?\.[0-9]+$|^1\.0$
                type: string
              image:
                default: docker.io/library/vllm-gemma4:local
                type: string
              imagePullPolicy:
                default: Never
                enum:
                - Always
                - IfNotPresent
                - Never
                type: string
              livenessProbe:
                description: |-
                  ProbeConfig is the tunable subset of a k8s probe.
                  Liveness periodSeconds=30 and failureThreshold=10 are hardcoded constants in the builder.
                properties:
                  failureThreshold:
                    format: int32
                    minimum: 1
                    type: integer
                  initialDelaySeconds:
                    format: int32
                    minimum: 0
                    type: integer
                  periodSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - failureThreshold
                - initialDelaySeconds
                - periodSeconds
                type: object
              maxModelLen:
                format: int32
                minimum: 1024
                type: integer
              migResource:
                pattern: ^nvidia\.com/mig-[0-9]+g\.[0-9]+gb$
                type: string
              migResourceCount:
                format: int32
                maximum: 8
                minimum: 1
                type: integer
              modelID:
                type: string
              progressDeadlineSeconds:
                format: int32
                minimum: 60
                type: integer
              quantization:
                type: string
              readinessProbe:
                description: |-
                  ProbeConfig is the tunable subset of a k8s probe.
                  Liveness periodSeconds=30 and failureThreshold=10 are hardcoded constants in the builder.
                properties:
                  failureThreshold:
                    format: int32
                    minimum: 1
                    type: integer
                  initialDelaySeconds:
                    format: int32
                    minimum: 0
                    type: integer
                  periodSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - failureThreshold
                - initialDelaySeconds
                - periodSeconds
                type: object
              servedModelName:
                description: |-
                  ServedModelName overrides the name vLLM advertises to clients
                  (`/v1/models` and the `model:` field in chat-completion requests). Maps
                  to vLLM's `--served-model-name`. When empty, vLLM serves under the same
                  name as `modelID`. Useful for serving the same logical model under a
                  stable name even when swapping checkpoints (e.g. `google/gemma-4-31B-it`
                  regardless of whether the backend weights are BF16 or NVFP4).
                type: string
              shmSizeLimit:
                pattern: ^[0-9]+[KMGT]i?$
                type: string
              tensorParallelSize:
                format: int32
                minimum: 1
                type: integer
              toolCallParser:
                type: string
            required:
            - gpuMemoryUtilization
            - livenessProbe
            - maxModelLen
            - migResource
            - migResourceCount
            - modelID
            - progressDeadlineSeconds
            - readinessProbe
            - shmSizeLimit
            - tensorParallelSize
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
