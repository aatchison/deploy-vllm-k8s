                type: object
              pvcName:
                type: string
                x-kubernetes-validations:
                - message: pvcName is immutable
                  rule: self == oldSelf
              pvcReadOnly:
                description: |-
                  PVCReadOnly, when true, mounts the model PVC at /models with
                  readOnly=true. Set this for any tenant that should consume — but never
