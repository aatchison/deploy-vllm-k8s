                && has(self.overrides.kvCacheDtype))
            - message: overrides.tensorParallelSize > 1 requires overrides.migResourceCount
                == tensorParallelSize
              rule: '!has(self.overrides) || !has(self.overrides.tensorParallelSize)
                || self.overrides.tensorParallelSize <= 1 || (has(self.overrides.migResourceCount)
                && self.overrides.migResourceCount == self.overrides.tensorParallelSize)'
            - message: replicas must be 0, 1, or 2 (each replica consumes one independently
                schedulable MIG slice)
              rule: '!has(self.replicas) || self.replicas <= 2'
            - message: LMCache offload is single-slice only in the current implementation
              rule: '!has(self.overrides) || !has(self.overrides.kvOffloadBackend)
                || self.overrides.kvOffloadBackend != ''lmcache'' || ((!has(self.overrides.migResourceCount)
                || self.overrides.migResourceCount <= 1) && (!has(self.overrides.tensorParallelSize)
                || self.overrides.tensorParallelSize <= 1))'
