                        type: integer
                      periodSeconds:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - failureThreshold
                    - initialDelaySeconds
                    - periodSeconds
                    type: object
                  servedModelName:
                    type: string
                  shmSizeLimit:
                    type: string
                  startupProbe:
                    description: |-
