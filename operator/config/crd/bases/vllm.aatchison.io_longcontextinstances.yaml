                        minimum: 0
                        type: integer
                      periodSeconds:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - failureThreshold
                    - initialDelaySeconds
                    - periodSeconds
                    type: object
                  maxModelLen:
                    format: int32
                    type: integer
                  maxNumBatchedTokens:
