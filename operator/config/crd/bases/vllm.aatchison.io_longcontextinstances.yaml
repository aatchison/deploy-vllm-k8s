                      All three fields (initialDelaySeconds, periodSeconds, failureThreshold) flow
                      through to the rendered Pod spec for both liveness and readiness probes.
                    properties:
                      failureThreshold:
                        format: int32
                        minimum: 1
                        type: integer
                      initialDelaySeconds:
                        format: int32
                        minimum: 0
                        type: integer
                      periodSeconds:
                        format: int32
                        minimum: 1
                        type: integer
                    required:
                    - failureThreshold
                    - initialDelaySeconds
                    - periodSeconds
                    type: object
                  tensorParallelSize:
                    format: int32
                    type: integer
                  toolCallParser:
                    type: string
