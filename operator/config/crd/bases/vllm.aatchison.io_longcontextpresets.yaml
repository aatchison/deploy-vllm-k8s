---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: longcontextpresets.vllm.aatchison.io
spec:
  group: vllm.aatchison.io
  names:
    kind: LongContextPreset
    listKind: LongContextPresetList
    plural: longcontextpresets
    shortNames:
    - lcp
    singular: longcontextpreset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelID
      name: Model
      type: string
    - jsonPath: .spec.migResource
      name: MIG
      type: string
    - jsonPath: .spec.maxModelLen
      name: Ctx
      type: integer
    - jsonPath: .spec.kvCacheDtype
      name: KV
      type: string
    - jsonPath: .spec.tensorParallelSize
      name: TP
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LongContextPreset is a preset for vLLM deployments that prioritize
          max-context-per-model over throughput. Consumed by LongContextInstance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LongContextPresetSpec is a preset tuned for maximum context length per model.
              It mirrors ModelPresetSpec field-for-field and adds two long-context-specific
              fields. The new type exists so the existing ModelPreset semantics are
              untouched while opinionated defaults (KV quantization, prefix caching) ship
              here.
            properties:
              chatTemplate:
                type: string
              codeRevision:
                description: |-
                  CodeRevision sets vLLM's --code-revision flag.
                  Omit to use the model repository default; only full commit SHAs are accepted.
                pattern: ^[0-9a-fA-F]{40}$
                type: string
              compilationConfig:
                type: string
              cpuOffloadGiB:
                description: |-
                  CPUOffloadGiB enables vLLM's --cpu-offload-gb flag, moving evicted KV
                  blocks to host RAM instead of recomputing on the next prefix hit.
                  Helps repeat-prefix TTFT at long context. 0 = disabled.
                format: int32
                minimum: 0
                type: integer
              disableCustomAllReduce:
                description: DisableCustomAllReduce sets vLLM's --disable-custom-all-reduce
                  flag.
                type: boolean
              dtype:
                type: string
              enableAutoToolChoice:
                type: boolean
              enableChunkedPrefill:
                description: |-
                  EnableChunkedPrefill toggles vLLM's chunked-prefill scheduler. Sidesteps
                  the multimodal budget check on v0.20+ when MaxNumBatchedTokens is left
                  at default. Useful for long-context throughput too.
                type: boolean
              enableLora:
                description: Enable LoRA adapter serving in vLLM
                type: boolean
              enablePrefixCaching:
                default: true
                description: |-
                  EnablePrefixCaching enables vLLM's RadixAttention-style automatic prefix
                  caching. Tri-state pointer semantics:
                    - nil      → use kubebuilder default (true at admission time)
                    - &false   → explicitly disabled
                    - &true    → explicitly enabled
                  The pointer type fixes the kubebuilder default+omitempty trap that
                  previously made it impossible to disable the field once defaulted on.
                nullable: true
                type: boolean
              enforceEager:
                nullable: true
                type: boolean
              engramConfig:
                description: |-
                  EngramConfig sets vLLM's --engram-config flag.
                  JSON object string, passed unchanged. Empty disables the flag.
                  Admission checks object shape; the operator validates full JSON syntax before apply.
                pattern: ^$|^[ \t\r\n]*\{[\s\S]*\}[ \t\r\n]*$
                type: string
              env:
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
                          - fieldPath
                          type: object
                          x-kubernetes-map-type: atomic
                        fileKeyRef:
                          description: |-
                            FileKeyRef selects a key of the env file.
                            Requires the EnvFiles feature gate to be enabled.
                          properties:
                            key:
                              description: |-
                                The key within the env file. An invalid key will prevent the pod from starting.
                                The keys defined within a source may consist of any printable ASCII characters except '='.
                                During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                              type: string
                            optional:
                              default: false
                              description: |-
                                Specify whether the file or its key must be defined. If the file or key
                                does not exist, then the env var is not published.
                                If optional is set to true and the specified key does not exist,
                                the environment variable will not be set in the Pod's containers.

                                If optional is set to false and the specified key does not exist,
                                an error will be returned during Pod creation.
                              type: boolean
                            path:
                              description: |-
                                The path within the volume from which to select the file.
                                Must be relative and may not contain the '..' path or start with '..'.
                              type: string
                            volumeName:
                              description: The name of the volume mount containing
                                the env file.
                              type: string
                          required:
                          - key
                          - path
                          - volumeName
                          type: object
                          x-kubernetes-map-type: atomic
                        resourceFieldRef:
                          description: |-
                            Selects a resource of the container: only resources limits and requests
                            (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                          properties:
                            containerName:
                              description: 'Container name: required for volumes,
                                optional for env vars'
                              type: string
                            divisor:
                              anyOf:
                              - type: integer
                              - type: string
                              description: Specifies the output format of the exposed
                                resources, defaults to "1"
                              pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                              x-kubernetes-int-or-string: true
                            resource:
                              description: 'Required: resource to select'
                              type: string
                          required:
                          - resource
                          type: object
                          x-kubernetes-map-type: atomic
                        secretKeyRef:
                          description: Selects a key of a secret in the pod's namespace
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              flashinferAutotune:
                description: |-
                  FlashinferAutotune sets vLLM's --enable-flashinfer-autotune flag.
                  Nil leaves the vLLM default unchanged; false emits --no-enable-flashinfer-autotune.
                type: boolean
              gpuMemoryUtilization:
                pattern: ^0?\.[0-9]+$|^1\.0$
                type: string
              image:
                default: docker.io/library/vllm-gemma4:local
                type: string
              imagePullPolicy:
                default: Never
                enum:
                - Always
                - IfNotPresent
                - Never
                type: string
              kvCacheDtype:
                default: fp8_e4m3
                description: |-
                  KVCacheDtype controls vLLM's --kv-cache-dtype flag. Required for this
                  preset type — long-context deployments must opt in to a specific KV
                  cache quantization. FP8 KV roughly halves KV memory at long context,
                  approximately doubling max-model-len at the same VRAM budget; NVFP4
                  (4-bit) goes further (~4× density) but is bleeding-edge — not all
                  vLLM versions support it. Use `auto` to let vLLM pick a default
                  compatible with the weight quantization.
                  fp8_e4m3 is chosen as the default because vLLM rejects fp8_e5m2 on
                  FP8/NVFP4 weight checkpoints; e4m3 works with both BF16 and quantized
                  weights. See issue #7.
                enum:
                - auto
                - fp8
                - fp8_e5m2
                - fp8_e4m3
                - nvfp4
                type: string
              kvCacheDtypeSkipLayers:
                type: string
              kvOffloadBackend:
                default: none
                description: |-
                  KVOffloadBackend selects an external KV-offload store. Empty/"none"
                  disables; "lmcache" reserves the slot for an in-pod LMCache sidecar
                  (wired in a follow-up PR — this PR adds the field only).
                enum:
                - none
                - lmcache
                type: string
              kvOffloadSize:
                description: |-
                  KVOffloadSize is the host-RAM budget for the external KV cache, in GiB.
                  Used as the LMCache buffer size when KVOffloadBackend == "lmcache".
                  0 = backend default.
                format: int32
                minimum: 0
                type: integer
              limitMmPerPrompt:
                type: string
              livenessProbe:
                description: |-
                  ProbeConfig is the tunable subset of a k8s probe.
                  All three fields (initialDelaySeconds, periodSeconds, failureThreshold) flow
                  through to the rendered Pod spec for both liveness and readiness probes.
                properties:
                  failureThreshold:
                    format: int32
                    minimum: 1
                    type: integer
                  initialDelaySeconds:
                    format: int32
                    minimum: 0
                    type: integer
                  periodSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - failureThreshold
                - initialDelaySeconds
                - periodSeconds
                type: object
              loraModules:
                description: 'LoRA module name and path format: name=path'
                type: string
              mambaBackend:
                type: string
              mambaCacheMode:
                enum:
                - all
                - align
                - none
                type: string
              maxLoraRank:
                description: Maximum LoRA rank allowed
                minimum: 1
                type: integer
              maxModelLen:
                format: int32
                minimum: 1024
                type: integer
              maxNumBatchedTokens:
                description: |-
                  MaxNumBatchedTokens caps tokens per scheduling iteration.
                  Required >= max_tokens_per_mm_item for multimodal models on vLLM v0.20+
                  (Gemma 4: 2496). Empty/0 = vLLM default (2048 on v0.20).
                format: int32
                minimum: 0
                type: integer
              maxNumSeqs:
                format: int32
                minimum: 0
                type: integer
              migResource:
                pattern: ^nvidia\.com/mig-[0-9]+g\.[0-9]+gb$
                type: string
              migResourceCount:
                format: int32
                maximum: 8
                minimum: 1
                type: integer
              modelID:
                type: string
              modelRevision:
                description: |-
                  ModelRevision sets vLLM's --revision flag.
                  Omit to use the model repository default; only full commit SHAs are accepted.
                pattern: ^[0-9a-fA-F]{40}$
                type: string
              progressDeadlineSeconds:
                format: int32
                minimum: 60
                type: integer
              quantization:
                type: string
              readinessProbe:
                description: |-
                  ProbeConfig is the tunable subset of a k8s probe.
                  All three fields (initialDelaySeconds, periodSeconds, failureThreshold) flow
                  through to the rendered Pod spec for both liveness and readiness probes.
                properties:
                  failureThreshold:
                    format: int32
                    minimum: 1
                    type: integer
                  initialDelaySeconds:
                    format: int32
                    minimum: 0
                    type: integer
                  periodSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - failureThreshold
                - initialDelaySeconds
                - periodSeconds
                type: object
              reasoningParser:
                type: string
              servedModelName:
                description: |-
                  ServedModelName overrides the name vLLM advertises to clients (see
                  the corresponding field on ModelPresetSpec for full docs). Useful for
                  keeping a stable client-facing name (e.g. `google/gemma-4-31B-it`)
                  regardless of whether the long-context preset's backend weights are
                  NVFP4 or BF16.
                type: string
              shmSizeLimit:
                pattern: ^[0-9]+[KMGT]i?$
                type: string
              speculativeConfig:
                type: string
              startupProbe:
                description: |-
                  ProbeConfig is the tunable subset of a k8s probe.
                  All three fields (initialDelaySeconds, periodSeconds, failureThreshold) flow
                  through to the rendered Pod spec for both liveness and readiness probes.
                properties:
                  failureThreshold:
                    format: int32
                    minimum: 1
                    type: integer
                  initialDelaySeconds:
                    format: int32
                    minimum: 0
                    type: integer
                  periodSeconds:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - failureThreshold
                - initialDelaySeconds
                - periodSeconds
                type: object
              tensorParallelSize:
                format: int32
                minimum: 1
                type: integer
              tokenizerRevision:
                description: |-
                  TokenizerRevision sets vLLM's --tokenizer-revision flag.
                  Omit to use the model repository default; only full commit SHAs are accepted.
                pattern: ^[0-9a-fA-F]{40}$
                type: string
              toolCallParser:
                type: string
              trustRemoteCode:
                default: false
                description: |-
                  TrustRemoteCode sets vLLM's --trust-remote-code flag.
                  Opt-in only: repository code runs inside the model container.
                type: boolean
            required:
            - gpuMemoryUtilization
            - kvCacheDtype
            - livenessProbe
            - maxModelLen
            - migResource
            - migResourceCount
            - modelID
            - progressDeadlineSeconds
            - readinessProbe
            - shmSizeLimit
            - tensorParallelSize
            type: object
            x-kubernetes-validations:
            - message: LMCache offload is single-slice only (kvOffloadBackend=lmcache
                requires migResourceCount=1 and tensorParallelSize=1)
              rule: '!(self.kvOffloadBackend == ''lmcache'' && (self.migResourceCount
                > 1 || self.tensorParallelSize > 1))'
        type: object
    served: true
    storage: true
    subresources: {}
