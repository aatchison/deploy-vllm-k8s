apiVersion: v1
kind: Namespace
metadata:
  name: vllm-system
  labels:
    control-plane: vllm-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-operator
  namespace: vllm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-operator
  namespace: vllm-system
  labels:
    control-plane: vllm-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: vllm-operator
  template:
    metadata:
      labels:
        control-plane: vllm-operator
    spec:
      serviceAccountName: vllm-operator
      # Pod-level security context (issue #37). Explicit UID/GID prevents a
      # silent regression if the operator base image swap-in ever changes the
      # default. fsGroup matches so any future emptyDir / projected volume is
      # writable by the running user. seccompProfile=RuntimeDefault is required
      # by the "restricted" PodSecurity admission profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Pinned to a digest so manager.yaml always resolves to a known
          # build. PR #62 dropped the floating `latest` tag from the image
          # publish workflow, so a tag pin is no longer available; digest
          # pinning is also the security-parity choice (issue #43 pins the
          # base image by digest for the same reason). Maintainers must
          # re-pin this on every release — see issue #64.
          image: ghcr.io/aatchison/vllm-operator@sha256:b5eb7bae95769e444488f1af564247fd6b7752aa1b6ac992dfa27d8d1534f953
          imagePullPolicy: Always
          args:
            - --leader-elect=false
          ports:
            # controller-runtime defaults: metrics on :8080, health on :8081.
            # Declared explicitly so a Service can target them by name and
            # so kubectl describe pod surfaces the contract (issue #40).
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          # Container-level hardening (issue #37). The operator binary is
          # statically built and writes nothing under /, so readOnlyRootFilesystem
          # is safe here (unlike the vLLM model pods which write to /tmp).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      terminationGracePeriodSeconds: 10
