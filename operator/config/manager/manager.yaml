apiVersion: v1
kind: Namespace
metadata:
  name: vllm-system
  labels:
    control-plane: vllm-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm-operator
  namespace: vllm-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-operator
  namespace: vllm-system
  labels:
    control-plane: vllm-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: vllm-operator
  template:
    metadata:
      labels:
        control-plane: vllm-operator
    spec:
      serviceAccountName: vllm-operator
      # Pod-level security context (issue #37). Explicit UID/GID prevents a
      # silent regression if the operator base image swap-in ever changes the
      # default. fsGroup matches so any future emptyDir / projected volume is
      # writable by the running user. seccompProfile=RuntimeDefault is required
      # by the "restricted" PodSecurity admission profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Pinned to a digest so manager.yaml always resolves to a known
          # build. PR #62 dropped the floating `latest` tag from the image
          # publish workflow, so a tag pin is no longer available; digest
          # pinning is also the security-parity choice (issue #43 pins the
          # base image by digest for the same reason). Maintainers must
          # re-pin this on every release — see issue #64.
          image: ghcr.io/aatchison/vllm-operator@sha256:f0ad9a0b6e86a46b5c66b0c6e8710967e2f03ad99f414f1a1678997345374626
          imagePullPolicy: Always
          ports:
            # controller-runtime defaults: metrics on :8080, health on :8081.
            # Declared explicitly so a Service can target them by name and
            # so kubectl describe pod surfaces the contract (issue #40).
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          # Runtime tuning for Go's GC + scheduler under cgroup limits
          # (issue #82). GOMEMLIMIT is ~90% of the memory limit so the GC
          # has headroom to react before the kernel OOM-kills the pod —
          # controller-runtime's informer cache can spike during relist.
          # GOMAXPROCS is set automatically at process start by the
          # go.uber.org/automaxprocs blank import in main.go (it reads the
          # cgroup CPU quota and clamps GOMAXPROCS to ceil(cpu_limit)),
          # which avoids scheduler thrash on large nodes where the default
          # would be runtime.NumCPU() (e.g. 32 on a 32-core host vs the
          # 1 we actually have headroom for).
          env:
            - name: GOMEMLIMIT
              value: "230MiB"
          # requests = limits → Guaranteed QoS class, so the kubelet won't
          # evict the operator under node memory/CPU pressure. The numbers
          # match the previous limits; the previous Burstable config (50m/128Mi
          # request, 500m/256Mi limit) made the operator a first-tier
          # eviction target during fleet incidents — exactly when the
          # control loop needs to keep running.
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 500m
              memory: 256Mi
          # Container-level hardening (issue #37). The operator binary is
          # statically built and writes nothing under /, so readOnlyRootFilesystem
          # is safe here (unlike the vLLM model pods which write to /tmp).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      # 30s matches controller-runtime's default leader-lease release
      # cycle (LeaseDuration=15s + RenewDeadline=10s + buffer). 10s was too
      # tight: SIGTERM could fire before the manager finished releasing
      # the Lease, leaving the standby waiting a full LeaseDuration before
      # taking over. Issue #82.
      terminationGracePeriodSeconds: 30
