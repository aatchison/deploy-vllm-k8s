version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    staticcheck:
      # v2 lint enables more checks than v1.57 ran by default. Restore the v1
      # behavior: keep SA*/S*/U*/QF* (real-bug categories) and skip stylecheck (ST*).
      # SA1019 (deprecated API usage) is on: the controller-runtime v0.24 bump
      # surfaced four deprecations and they were migrated in #72.
      checks: ["SA*", "S*", "U*", "QF*"]
  exclusions:
    rules:
      # controller-runtime reconciler returns from generated code hit this
      - path: controllers/
        linters: [unused]
