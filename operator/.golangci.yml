version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
  exclusions:
    rules:
      # controller-runtime reconciler returns from generated code hit this
      - path: controllers/
        linters: [unused]
