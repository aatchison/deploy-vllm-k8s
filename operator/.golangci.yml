version: "2"

run:
  timeout: 5m
  go: "1.26"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: true
    staticcheck:
      # SA1019 (deprecation) suppressed during the controller-runtime v0.17 -> v0.24
      # bump. Several APIs were deprecated in this jump (client.Apply, scheme.Builder,
      # mgr.GetEventRecorderFor, res.Requeue) — migrating each is tracked in its own
      # follow-up issue. Re-enable once that work lands.
      checks: ["all", "-SA1019"]
  exclusions:
    rules:
      # controller-runtime reconciler returns from generated code hit this
      - path: controllers/
        linters: [unused]
