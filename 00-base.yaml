---
apiVersion: v1
kind: Namespace
metadata:
  name: vllm

---
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: vllm
type: Opaque
stringData:
  # ── CHANGE ME ──────────────────────────────────────────────────
  # Replace with your HuggingFace access token.
  # Get one at: https://huggingface.co/settings/tokens
  token: "YOUR_HUGGINGFACE_TOKEN_HERE"

# Storage (PV+PVC) and Services are now owned by the vLLM operator.
# See operator/config/storage/{pv-nfs,pvc-local}.yaml for PVC samples.
